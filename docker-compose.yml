name: channelhub

# 进销存数据平台 — 本地开发基础设施
# 变量取值来自同目录 .env（由 openssl 随机生成；模板见 .env.example）
# 本轮仅基础设施，不含业务表 DDL。

services:
  # ---------------------------------------------------------------------------
  # 主数据库：承载 channelhub(主业务库) + metabase + prefect 三个库
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: channelhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 仅绑定本机回环；外部访问走 SSH 隧道,避免公网暴露 Postgres
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # 首启（空卷）时自动执行：仅创建 metabase / prefect 空支撑库
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - channelhub


  # ---------------------------------------------------------------------------
  # 数据库可视化管理；已预注册 ChannelHub-PG 服务器
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: channelhub-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    ports:
      # 仅本机回环；外部访问走 SSH 隧道
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - channelhub

  # ---------------------------------------------------------------------------
  # 对象存储：邮件源文件备份桶（写入逻辑后续由 Prefect 实现）
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: channelhub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      # 仅本机回环；外部访问走 SSH 隧道
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - channelhub

  # ---------------------------------------------------------------------------
  # 一次性任务：等待 MinIO 就绪后幂等创建桶，跑完即退出
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: channelhub-minio-init
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null 2>&1; do
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb --ignore-existing local/\"$$MINIO_BUCKET\";
      echo 'bucket ready: '\"$$MINIO_BUCKET\";
      "
    restart: "no"
    networks:
      - channelhub

  # ---------------------------------------------------------------------------
  # BI 报表；应用元数据库指向 postgres 的 metabase 库
  # ---------------------------------------------------------------------------
  metabase:
    image: metabase/metabase:latest
    container_name: channelhub-metabase
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: "5432"
      MB_DB_HOST: postgres
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
    ports:
      # 仅本机回环；外部访问经 Caddy HTTPS(443)反代,或 SSH 隧道
      - "127.0.0.1:${METABASE_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - channelhub

  # ---------------------------------------------------------------------------
  # Prefect 3 OSS server；后端库指向 postgres 的 prefect 库
  # ---------------------------------------------------------------------------
  prefect:
    image: prefecthq/prefect:3-latest
    container_name: channelhub-prefect
    restart: unless-stopped
    command: prefect server start --host 0.0.0.0 --port 4200
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/prefect
      PREFECT_API_URL: http://localhost:${PREFECT_PORT:-4200}/api
      # 让浏览器 SPA 用相对路径访问 API：无论经 localhost / 127.0.0.1 / LAN IP
      # 打开 UI 都能连通（解决从非 docker 主机访问时 "Oops" 报错）
      PREFECT_UI_API_URL: /api
      PREFECT_SERVER_API_HOST: 0.0.0.0
    ports:
      # 仅本机回环；外部访问走 SSH 隧道,Prefect OSS 没有内置认证不能公网暴露
      - "127.0.0.1:${PREFECT_PORT:-4200}:4200"
    volumes:
      - prefect_data:/root/.prefect
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - channelhub

  # ---------------------------------------------------------------------------
  # Superset 一次性初始化:升级元数据 schema + 建管理员 + 加载内置角色权限
  # 跑完即退出;后续 superset 服务依赖它 service_completed_successfully
  # ---------------------------------------------------------------------------
  superset-init:
    build:
      context: ./superset
    image: channelhub-superset:4.1.1
    container_name: channelhub-superset-init
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL}
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        superset db upgrade &&
        (superset fab create-admin
          --username "$$SUPERSET_ADMIN_USERNAME"
          --firstname Admin --lastname User
          --email "$$SUPERSET_ADMIN_EMAIL"
          --password "$$SUPERSET_ADMIN_PASSWORD" || true) &&
        superset init
    restart: "no"
    networks:
      - channelhub

  # ---------------------------------------------------------------------------
  # Superset BI(主对外 BI 工具),经 Caddy 443 公网暴露
  # 元数据库在同一个 Postgres 实例的 superset 库;数据源连同实例的 channelhub
  # 库(只读角色 bi_readonly),由 scripts/superset_setup.py 注册
  # ---------------------------------------------------------------------------
  superset:
    build:
      context: ./superset
    image: channelhub-superset:4.1.1
    container_name: channelhub-superset
    restart: unless-stopped
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # 绑定地址可配:默认 127.0.0.1(仅本机回环,服务器走 Caddy HTTPS/SSH 隧道);
      # 本机要局域网可见时在 .env 设 SUPERSET_BIND=0.0.0.0。
      - "${SUPERSET_BIND:-127.0.0.1}:${SUPERSET_PORT:-8088}:8088"
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset_data:/app/superset_home
    depends_on:
      postgres:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - channelhub

  # ---------------------------------------------------------------------------
  # HTTPS 反向代理:Caddy 给 Superset UI 自动申请公网证书;Prefect 与
  # Metabase 不对外,走 SSH 隧道访问。对外域名由 .env 的 PREFECT_PROXY_HOST
  # 注入(变量名是历史遗留,语义=Caddy 对外暴露的 host)。
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2
    container_name: channelhub-caddy
    restart: unless-stopped
    environment:
      PREFECT_PROXY_HOST: ${PREFECT_PROXY_HOST}
    ports:
      - "${PREFECT_HTTP_PORT:-80}:80"
      - "${PREFECT_HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      superset:
        condition: service_healthy
    networks:
      - channelhub

  # ---------------------------------------------------------------------------
  # WireGuard VPN(wg-easy):远程设备用**官方 WireGuard 客户端**接入本服务器。
  # 默认 full tunnel(AllowedIPs=0.0.0.0/0)——客户端所有上网流量从本机出口出去,
  # 对外呈现的就是这台 VM 的固定 IP(ens6 上的 /32 公网地址)。
  #
  # 首启由 INIT_* 自动初始化;之后一切以 volume 里的 wg-easy.db 为准
  # (改 .env 的 WG_* 不会覆盖已初始化的库,要改配置请进管理 UI)。
  #
  # 部署后还要做一步(容器管不了):在 IONOS Cloud Panel 的防火墙策略放行
  # UDP ${WG_PORT}。详见 docs/VPN.md。
  # ---------------------------------------------------------------------------
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: channelhub-wg-easy
    restart: unless-stopped
    environment:
      # 首启自动初始化;库已存在时下列值全部被忽略
      INIT_ENABLED: "true"
      INIT_USERNAME: ${WG_ADMIN_USERNAME:-admin}
      INIT_PASSWORD: ${WG_ADMIN_PASSWORD}
      # 写进客户端配置的 Endpoint。本机公网 IP 固定,直接填 IP 即可
      INIT_HOST: ${WG_HOST}
      INIT_PORT: ${WG_PORT:-51820}
      INIT_DNS: ${WG_DNS:-1.1.1.1}
      INIT_IPV4_CIDR: ${WG_IPV4_CIDR:-10.8.0.0/24}
      # full tunnel;若只想走内网,改成 172.18.0.0/16, 10.8.0.0/24
      INIT_ALLOWED_IPS: ${WG_ALLOWED_IPS:-0.0.0.0/0}
      # 隧道内只跑 IPv4:channelhub 这张 bridge 没开 IPv6,开了会启动报错
      DISABLE_IPV6: "true"
      # 管理 UI 走明文 HTTP —— 前提是它只绑 127.0.0.1(见下面 ports)。
      # 若把 WG_UI_BIND 改成 0.0.0.0,请先解决 TLS,别裸奔。
      INSECURE: ${WG_INSECURE:-true}
    volumes:
      - wg_easy_data:/etc/wireguard
      # 容器内 modprobe wireguard 需要(配合 SYS_MODULE)
      - /lib/modules:/lib/modules:ro
    ports:
      # UDP 隧道口:必须 0.0.0.0,否则外部客户端连不进来
      - "${WG_PORT:-51820}:51820/udp"
      # 管理 UI:默认仅本机,远程管理走 SSH 隧道(同 Prefect / Metabase 的套路)
      - "${WG_UI_BIND:-127.0.0.1}:${WG_UI_PORT:-51821}:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      # 只作用于容器自己的 netns,不动宿主机内核参数
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      - channelhub

  # ---------------------------------------------------------------------------
  # 一次性任务：创建 process work pool 并把 prefect.yaml 里的 deployment 注册到服务端
  # ---------------------------------------------------------------------------
  prefect-deploy:
    build:
      context: ./flows
    container_name: channelhub-prefect-deploy
    working_dir: /app
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      PREFECT_CLI_PROMPT: "false"
      # 带默认值：服务器 .env 若还是旧版(缺这两项)也能注册出正确排期
      EMAIL_BACKUP_CRON: ${EMAIL_BACKUP_CRON:-*/5 * * * *}
      EMAIL_PARSE_CRON: ${EMAIL_PARSE_CRON:-0 3 * * *}
    volumes:
      - ./flows:/app/flows:ro
      - ./prefect.yaml:/app/prefect.yaml:ro
    depends_on:
      prefect:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        prefect work-pool inspect channelhub-pool >/dev/null 2>&1
        || prefect work-pool create channelhub-pool --type process;
        prefect deploy --all
    restart: "no"
    networks:
      - channelhub

  # ---------------------------------------------------------------------------
  # 常驻 worker：轮询 channelhub-pool，执行邮件备份 flow run
  # ---------------------------------------------------------------------------
  prefect-worker:
    build:
      context: ./flows
    container_name: channelhub-prefect-worker
    working_dir: /app
    command: prefect worker start --pool channelhub-pool
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      # flow 运行期读取的邮箱与 MinIO 配置（密钥不进 Prefect 服务端）
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      EMAIL_FOLDERS: ${EMAIL_FOLDERS}
      EMAIL_BACKUP_PREFIX: ${EMAIL_BACKUP_PREFIX}
      MINIO_ENDPOINT: ${EMAIL_BACKUP_MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_SECURE: "false"
      # 解析 ETL：写 raw.* 用的 Postgres 连接（容器网络内主机名 postgres）
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # 未识别附件告警：经 IONOS SMTP 发给 ALERT_EMAIL_TO
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO}
      # 邮件服务：true=照常生成附件与记账但**不实际发信**（首次上线务必先 true）
      MAIL_SERVICE_DRY_RUN: ${MAIL_SERVICE_DRY_RUN:-true}
    volumes:
      - ./flows:/app/flows:ro
    depends_on:
      prefect-deploy:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - channelhub

volumes:
  pg_data:
  pgadmin_data:
  minio_data:
  prefect_data:
  caddy_data:
  caddy_config:
  superset_data:
  wg_easy_data:

networks:
  channelhub:
    driver: bridge
