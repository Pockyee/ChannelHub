# ChannelHub Prefect 部署定义
# 由 prefect-deploy 一次性容器执行 `prefect deploy --all` 注册到服务端。
# 进程型 work pool；worker 容器已把代码挂到 /app，故工作目录设为 /app。

name: channelhub
prefect-version: "3"

build: null
push: null
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /app

deployments:
  - name: email-backup
    entrypoint: flows/email_backup.py:email_backup
    description: "IONOS 邮箱 INBOX 源文件定时备份到 MinIO（幂等）"
    work_pool:
      name: channelhub-pool
    schedules:
      - cron: "{{ $EMAIL_BACKUP_CRON }}"
        timezone: "UTC"
        active: true

  - name: parse-sell-through
    entrypoint: flows/parse_sell_through.py:parse_sell_through
    description: "MinIO .eml → xlsx → 表头识别 → raw.sell_through_<供应商>；未识别发告警；末尾刷新 mart 物化层"
    work_pool:
      name: channelhub-pool
    # 主触发路径：email-backup **收到新邮件时**才 run_deployment 触发（见
    # flows/email_backup.py）。下面这条 cron 只是每日兜底补跑：email-backup 以前
    # 每小时无条件触发一次，天然会把失败的解析补上；现在改成按需触发后需要它补位。
    # 本 flow 实测 136 秒（全量重扫归档），别把它调回高频。
    schedules:
      - cron: "{{ $EMAIL_PARSE_CRON }}"
        timezone: "UTC"
        active: true

  - name: mail-service
    entrypoint: flows/mail_service.py:mail_service
    description: "MinIO .eml → 规则匹配（发件人域名 + 附件签名）→ 生成附件并回信；先占坑再发信，不重复回信"
    work_pool:
      name: channelhub-pool
    # 无独立 cron：同样由 email-backup 收到新邮件后触发。
    # 回信是对外动作，不该在没有新邮件时空跑。
    schedules: []
