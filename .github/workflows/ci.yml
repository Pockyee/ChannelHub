name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  python-syntax:
    name: Python 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 编译所有 .py(语法检查)
        run: python -m compileall -q flows scripts

      - name: Ruff lint(允许失败,先观察)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check flows scripts

  compose-validate:
    name: docker-compose 配置校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 用 .env.example 校验 compose 语法
        run: |
          cp .env.example .env
          docker compose config -q
